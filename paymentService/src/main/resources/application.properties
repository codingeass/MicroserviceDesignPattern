spring.application.name=paymentService
server.port=8082
springdoc.api-docs.path=/api-docs
spring.cloud.function.definition=confirmPayment

spring.cloud.stream.bindings.reverseOrder-out-0.destination=order-service-reversal-status
spring.cloud.stream.bindings.revertOrderDelivery-out-0.destination=revert-delivery-order
spring.cloud.stream.bindings.confirmPayment-in-0.destination=confirm-payment

spring.rabbitmq.host=rabbitMQ
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10s
