spring.application.name=order
springdoc.api-docs.path=/api-docs
service.api.delivery=http://deliveryServiceApp:8081/delivery
spring.main.allow-circular-references=true
spring.aop.proxy-target-class=true
logging.level.io.github.resilience4j=DEBUG

resilience4j.circuitbreaker.instances.CircuitBreakerService.failure-rate-threshold=1
resilience4j.circuitbreaker.instances.CircuitBreakerService.minimum-number-of-calls=1
resilience4j.circuitbreaker.instances.CircuitBreakerService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.CircuitBreakerService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.CircuitBreakerService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.CircuitBreakerService.sliding-window-size=10
resilience4j.retry.instances.OrderServiceBookRetry.max-attempts=1
resilience4j.retry.instances.OrderServiceBookRetry.wait-duration=1s
resilience4j.retry.metrics.legacy.enabled=true
resilience4j.retry.metrics.enabled=true

resilience4j.retry.instances.OrderServiceBookRetry.retryExceptions[0]=com.app.shopping.orderService.exception.OrderCreationException
resilience4j.circuitbreaker.instances.CircuitBreakerService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.CircuitBreakerService.waitDurationInOpenState=10000

resilience4j.circuitbreaker.instances.CircuitBreakerService.record-exceptions[0]=com.app.shopping.orderService.exception.OrderCreationException