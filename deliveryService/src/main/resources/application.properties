spring.application.name=delivery
server.port=8081
springdoc.api-docs.path=/api-docs
spring.cloud.function.definition=bookOrderDelivery;revertOrderDelivery

spring.cloud.stream.bindings.confirmPayment-out-0.destination=confirm-payment
spring.cloud.stream.bindings.reverseOrder-out-0.destination=order-service-reversal-status
spring.cloud.stream.bindings.bookOrderDelivery-in-0.destination=update-delivery-status
spring.cloud.stream.bindings.revertOrderDelivery-in-0.destination=revert-delivery-order

spring.rabbitmq.host=rabbitMQ
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10s